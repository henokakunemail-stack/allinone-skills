schema_version: "1.1"
name: s4-vague-success-criteria
expected_outcome: |
  The agent turns 'bagus, cepat, mudah dipakai' into concrete, checkable assumptions or criteria (for example load without network requests, updates every second, large readable font), flagged as assumptions, and every Accept line passes the stranger test (a command or action with an observable result). Verification contains evidence, not 'looks good'.
